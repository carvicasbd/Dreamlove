name: Build AnunciosLimpieza Android APK
on:
  push:
    branches: [ anuncioslimpieza-apk-fix ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AnunciosLimpieza-Empleo-Android-v2.3-FIX.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AnunciosLimpieza-Empleo-Android-v2.3-FIX
          path: AnunciosLimpieza-Empleo-Android-v2.3-FIX.apk
          if-no-files-found: error
