name: Build AnunciosLimpieza Android Ofertas

on:
  push:
    branches:
      - anuncioslimpieza-android-demandas
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: yes | sdkmanager --licenses >/dev/null || true; sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: anuncioslimpieza-android
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          cp anuncioslimpieza-android/app/build/outputs/apk/debug/app-debug.apk artifact/AnunciosLimpieza-Ofertas-Android-v1.0.apk
          sha256sum artifact/AnunciosLimpieza-Ofertas-Android-v1.0.apk > artifact/AnunciosLimpieza-Ofertas-Android-v1.0.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AnunciosLimpieza-Ofertas-Android-v1.0
          path: artifact/
          if-no-files-found: error
          retention-days: 7
