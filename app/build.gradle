plugins { id 'com.android.application' }

android {
    namespace 'es.anuncioslimpieza.importador'
    compileSdk 35

    defaultConfig {
        applicationId 'es.anuncioslimpieza.importador'
        minSdk 26
        targetSdk 35
        versionCode 143
        versionName '2.3.0'
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
