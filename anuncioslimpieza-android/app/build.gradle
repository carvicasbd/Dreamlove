plugins {
    id 'com.android.application'
}

android {
    namespace 'es.anuncioslimpieza.importador'
    compileSdk 35

    defaultConfig {
        applicationId 'es.anuncioslimpieza.importador'
        minSdk 26
        targetSdk 35
        versionCode 130
        versionName '1.3.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
